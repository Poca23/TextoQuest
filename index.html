<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TextoQuest</title>
    <link rel="icon" href="assets/favicon/favicon-32x32.png" sizes="32x32" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="assets/responsive.css">
    <link rel="stylesheet" href="assets/index-library.css" />

    <link rel="manifest" href="manifest.json" />
</head>

<body>
    <div class="screen active">
        <div class="index-wrap">
            <div class="intro-logo-wrap">
                <img src="assets/logo/logo_TextoQuest.png" alt="TextoQuest" />
            </div>
            <div id="stories-grid" class="stories-grid"></div>
        </div>
    </div>

    <script>
        /* ── REGISTRY : ajoute ici chaque nouvelle histoire ── */
        const STORIES = [
            {
                id: "story-1",
                level: 1,
                title: "La Forêt des Murmures",
                desc: "Une aventure courte pour s'initier au jeu.",
                cover: "stories/story-1/cover.png",
            }, {
                id: "story-2",
                level: 2,
                title: "L'Hirondelle Blanche",
                desc: "Un voyage initiatique à la recherche d'une vraie famille.",
                cover: "stories/story-2/cover.png",
            },
            {
                id: "story-3",
                level: 3,
                title: "L'Épreuve Cachée",
                desc: "Une mission nocturne sur les toits de Kazan.",
                cover: "stories/story-3/cover.png",
            },
        ];

        /* ── Rendu automatique ────────────────────────────── */
        const grid = document.getElementById("stories-grid");

        STORIES.sort((a, b) => a.level - b.level).forEach(s => {
            const dots = [1, 2, 3].map(i =>
                `<span class="${i <= s.level ? "on" : ""}"></span>`
            ).join("");

            grid.insertAdjacentHTML("beforeend", `
        <a class="story-card" href="game.html?story=${s.id}">
          <img class="card-cover" src="${s.cover}" alt="${s.title}"
               onerror="this.style.display='none'" />
          <span class="card-level">
            Niveau ${s.level} &nbsp;<span class="level-dot">${dots}</span>
          </span>
          <span class="card-title">${s.title}</span>
          <span class="card-desc">${s.desc}</span>
        </a>
      `);
        });
    </script>
</body>

</html>
